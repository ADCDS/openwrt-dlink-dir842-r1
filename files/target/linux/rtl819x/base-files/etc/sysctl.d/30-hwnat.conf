# M6.6: per-conntrack byte/packet accounting. With hardware NAT offload a flow's
# packets are carried by the ASIC and never seen by the CPU, so these counters
# FREEZE once the flow is offloaded — that frozen counter (while iperf3 still reports
# throughput) is the direct proof the datapath moved into silicon (Phase 4).
net.netfilter.nf_conntrack_acct=1
