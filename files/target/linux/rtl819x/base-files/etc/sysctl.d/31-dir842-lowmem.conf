# DIR-842 R1 (RTL8197F, 64 MB DRAM) -- reclaim the over-reserved free-page floor.
#
# ★ WHY THIS EXISTS. OpenWrt's own /etc/init.d/sysctl apply_defaults() picks
# vm.min_free_kbytes purely by RAM size:
#
#     if   mem > 65536 (128M) -> min_free=16384
#     elif mem > 32768  (64M) -> min_free=8192      <-- this board lands here
#     else                    -> min_free=1024
#
# This board reports MemTotal ~58 MB (64 MB minus ~8.5 MB of kernel/ASIC
# reservations), so it takes the 8192 kB branch and pins 8 MB -- about 14% of
# usable RAM -- as an untouchable floor. That is survivable with one radio, but
# with BOTH the vendor rtl8192cd 2.4 GHz driver and rtw88 5 GHz loaded, plus
# hostapd and wpa_supplicant, the allocator sits permanently just under the
# watermark and the OOM killer starts reaping working daemons. Observed directly
# on hardware 2026-09-03:
#
#     Normal free:8104kB ... min:8192kB low:10240kB high:12288kB
#     oom-kill: ... task=dnsmasq / task=netifd
#
# i.e. free was 88 kB BELOW min while ~8 MB sat reserved and unusable -- the box
# was killing dnsmasq and netifd to defend a floor it did not need. This is what
# the dual-radio "memory ceiling" really was: a watermark policy mismatch, NOT the
# board being too small. The 4.14 product ran both radios on this exact hardware
# with 8.4-9.2 MB available and zero OOM (verified by flashing v1.4 back and
# measuring), on an older OpenWrt whose sysctl defaults predate this rule.
#
# 2048 kB still comfortably exceeds the kernel's own computed default for this
# size (min_free_kbytes = int_sqrt(lowmem_kbytes * 16), ~1 MB here), so atomic and
# GFP_ATOMIC allocations in the NIC/WiFi RX paths keep a real reserve, while
# returning ~6 MB to general use.
#
# Ordering note: /etc/init.d/sysctl runs apply_defaults() FIRST and only then
# sources /etc/sysctl.d/*.conf, so this file reliably overrides the default above.
vm.min_free_kbytes=2048
