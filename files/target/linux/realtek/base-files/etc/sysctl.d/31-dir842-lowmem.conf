# DIR-842 R1 (RTL8197F, 64 MB DRAM) -- reclaim the over-reserved free-page floor.
#
# ★ WHY THIS EXISTS. OpenWrt's own /etc/init.d/sysctl apply_defaults() picks
# vm.min_free_kbytes purely by RAM size:
#
#     if   mem > 65536 (128M) -> min_free=16384
#     elif mem > 32768  (64M) -> min_free=8192      <-- this board lands here
#     else                    -> min_free=1024
#
# This board reports MemTotal ~58 MB (64 MB minus ~8.5 MB of kernel/ASIC
# reservations), so it takes the 8192 kB branch and pins 8 MB -- about 14% of
# usable RAM -- as an untouchable floor. Found on THIS 4.14 base too, not just
# the 6.18 port: the BRAVO profile build (both radios + hostapd + wpa_supplicant
# + uhttpd) hit a real OOM cascade on hardware 2026-09-05 -- free sat at 8844 kB
# against an 8192 kB floor, close enough that ordinary daemon activity (hostapd,
# ntpd) pushed it under, and the kernel oom-killer reaped netifd and hostapd
# outright (`ash invoked oom-killer`, `oom_reaper: reaped process ... netifd`,
# `... hostapd`). ash itself started failing to fork (`ip a` segfaulting,
# dropbear resetting new connections mid-kex) before the watermark was lowered.
#
# An earlier note here assumed the 4.14 product ran both radios with 8.4-9.2 MB
# free and zero OOM on an "older OpenWrt whose sysctl defaults predate this
# rule" -- that assumption does not hold once uhttpd is added on top (as the
# BRAVO/LuCI-enabled case above did): this base's /etc/init.d/sysctl carries the
# exact same size-tiered apply_defaults() logic as the 6.18 port, so it needs
# the exact same fix.
#
# 2048 kB still comfortably exceeds the kernel's own computed default for this
# size (min_free_kbytes = int_sqrt(lowmem_kbytes * 16), ~1 MB here), so atomic and
# GFP_ATOMIC allocations in the NIC/WiFi RX paths keep a real reserve, while
# returning ~6 MB to general use. Verified live: free went from 8844 kB to
# 18220 kB immediately after `sysctl -w vm.min_free_kbytes=2048`, no further
# OOM kills.
#
# Ordering note: /etc/init.d/sysctl runs apply_defaults() FIRST and only then
# sources /etc/sysctl.d/*.conf, so this file reliably overrides the default above.
vm.min_free_kbytes=2048
