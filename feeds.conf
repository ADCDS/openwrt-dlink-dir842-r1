# R5: LuCI PINNED to openwrt-19.07.
# This base is a 4.14/19.07-era tree (ggbruno fork @ 8a0ccb9). The luci feed's master
# branch has been ucode-based since 2023, so luci-base there pulls ucode-mod-html and
# liblucihttp-ucode, which do not build against this base — that is what blocked LuCI in
# the first R5 attempt. The 19.07 branch is the Lua-era LuCI that matches this tree, and
# its runtime deps (rpcd, uhttpd, libubus-lua) come from base package/, not the feed.
src-git luci https://git.openwrt.org/project/luci.git;openwrt-19.07
src-git packages https://git.openwrt.org/feed/packages.git;openwrt-19.07
src-git routing https://git.openwrt.org/feed/routing.git
src-git telephony https://git.openwrt.org/feed/telephony.git
